<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Surrey Community Food Bank · Database</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--g:#1e6b52;--g2:#e8f3ee;--ink:#17202b;--mut:#667085;--line:#e6e8ec;--bg:#f5f6f8;--red:#c0362c;--redbg:#fdecea;--amb:#a15c07;--ambbg:#fef4e6;--blue:#2457a6;--bluebg:#eaf1fb}
*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,sans-serif;background:var(--bg);color:var(--ink);font-size:14px}
.app{display:flex;min-height:100vh}
aside{width:232px;background:#12352a;color:#d6e6df;padding:20px 12px;position:sticky;top:0;height:100vh;flex-shrink:0;overflow:auto}
aside h1{font-size:15px;color:#fff;margin:0 8px 2px}aside .sub{font-size:12px;opacity:.65;margin:0 8px 18px}
aside .grp{font-size:11px;text-transform:uppercase;letter-spacing:.06em;opacity:.5;margin:16px 8px 6px}
aside a{display:flex;justify-content:space-between;padding:8px 10px;border-radius:7px;color:inherit;text-decoration:none;cursor:pointer}
aside a:hover{background:#1b4a3b}aside a.on{background:#2b6b55;color:#fff}aside a small{opacity:.6}
main{flex:1;padding:26px 30px;min-width:0}
h2{margin:0 0 4px;font-size:22px}.lead{color:var(--mut);margin:0 0 18px}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:12px;margin-bottom:22px}
.card{background:#fff;border:1px solid var(--line);border-radius:10px;padding:14px 16px}.card b{display:block;font-size:26px;margin-top:4px}.card span{color:var(--mut);font-size:12.5px}
.card.warn b{color:var(--red)}
.flow{display:grid;grid-template-columns:1fr auto 1fr auto 1fr auto 1fr;align-items:center;gap:8px;background:#fff;border:1px solid var(--line);border-radius:10px;padding:18px;margin-bottom:22px}
.flow div.n{background:var(--g2);border-radius:8px;padding:12px;text-align:center;font-weight:600}.flow div.n small{display:block;font-weight:400;color:var(--mut);margin-top:3px}.flow .ar{color:var(--g);font-size:20px}
.tools{display:flex;gap:10px;align-items:center;margin-bottom:12px;flex-wrap:wrap}
input,select{font:inherit;padding:8px 11px;border:1px solid #d0d5dd;border-radius:8px;background:#fff}input{width:280px}
.cnt{color:var(--mut);font-size:13px;margin-left:auto}
.tbl{background:#fff;border:1px solid var(--line);border-radius:10px;overflow:auto;max-height:calc(100vh - 210px)}
table{border-collapse:collapse;width:100%}th{position:sticky;top:0;background:#f9fafb;text-align:left;font-weight:600;font-size:12.5px;color:#475467;padding:10px 12px;border-bottom:1px solid var(--line);cursor:pointer;white-space:nowrap;user-select:none}
td{padding:10px 12px;border-bottom:1px solid #f0f1f3;vertical-align:top}tr:hover td{background:#fafbfc}
.pill{display:inline-block;padding:2px 9px;border-radius:99px;font-size:12px;font-weight:500;white-space:nowrap;background:#f2f4f7;color:#344054}
.p-HIGH,.p-EXPIRED,.p-Missed,.p-Failed{background:var(--redbg);color:var(--red)}.p-Delayed,.p-Pending,.p-Template,.p-Scheduled,.p-Upcoming,.p-WATCH{background:var(--ambbg);color:var(--amb)}
.p-Fulfilled,.p-Approved,.p-Sent,.p-OK,.p-Active,.p-Coordinator{background:var(--g2);color:var(--g)}.p-Business,.p-Organization,.p-Automatic{background:var(--bluebg);color:var(--blue)}.p-AI,.p-Muse{background:#f1ecfd;color:#5b3fb5}
.who{font-weight:600}.role{font-size:12px;color:var(--mut)}.arrow{color:var(--g);font-weight:700;padding:0 6px}
.items{color:#475467;font-size:12.5px;line-height:1.55}.more{color:var(--g);cursor:pointer;font-size:12.5px}
.neg{color:var(--red);font-weight:600}.soon{color:var(--amb);font-weight:600}
.mail{white-space:pre-wrap;background:#f9fafb;border:1px solid var(--line);border-radius:8px;padding:10px;font-size:12.5px;margin-top:6px;display:none}
.btn{font:inherit;font-weight:600;border:0;border-radius:8px;padding:10px 16px;cursor:pointer;background:var(--g);color:#fff}.btn.sec{background:#fff;color:var(--g);border:1px solid var(--g)}.btn:disabled{opacity:.55;cursor:wait}
.panel{background:#fff;border:1px solid var(--line);border-radius:10px;padding:18px;margin-bottom:16px}.panel h3{margin:0 0 4px;font-size:15px}.panel p.role{margin:0 0 12px}
.out{white-space:pre-wrap;background:#f9fafb;border:1px solid var(--line);border-radius:8px;padding:12px;font-size:13px;line-height:1.55;margin-top:12px;min-height:44px;color:#344054}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}.row input{flex:1;min-width:240px}.badge{font-size:12px;padding:3px 9px;border-radius:99px;background:var(--g2);color:var(--g);font-weight:600}.badge.off{background:var(--ambbg);color:var(--amb)}
.demo{background:#fff8eb;border:1px solid #f5d9a8;color:#7a4b00;border-radius:10px;padding:10px 14px;margin-bottom:16px;font-size:13px}.demo b{color:#5c3800}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}@media(max-width:1000px){.grid2{grid-template-columns:1fr}}
input[type=date]{width:auto}select.wide{max-width:420px;width:100%}
.mini{font:inherit;font-size:12px;padding:3px 8px;border-radius:6px;border:1px solid #d0d5dd;background:#fff;cursor:pointer;margin:4px 4px 0 0}.mini:hover{border-color:var(--g);color:var(--g)}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}.chip{font-size:12.5px;border:1px solid #d0d5dd;background:#fff;border-radius:99px;padding:5px 10px;cursor:pointer}
@media(max-width:800px){aside{display:none}main{padding:16px}.flow{grid-template-columns:1fr}.flow .ar{transform:rotate(90deg);text-align:center}}
</style></head><body><div class="app">
<aside><h1>Surrey Community Food Bank</h1><p class="sub">Database viewer · live</p><div id="nav"></div></aside>
<main id="m"></main></div>
<script>
let D=null;
const esc=v=>v==null?'':String(v).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const pill=v=>v==null||v===''?'':`<span class="pill p-${esc(String(v).split(' ')[0])}">${esc(v)}</span>`;
const PILLS=['Risk','Status','Type','Role','Written By','Mode','When'];
const fmtItems=(s,id)=>{if(!s)return '<span class="role">No items</span>';const a=s.split('||');const first=a.slice(0,3).map(esc).join('<br>');
 return `<div class="items">${first}${a.length>3?`<span id="x${id}" style="display:none"><br>${a.slice(3).map(esc).join('<br>')}</span><br><span class="more" onclick="document.getElementById('x${id}').style.display='inline';this.remove()">+ ${a.length-3} more</span>`:''}</div>`};
const S=[
 {k:'overview',t:'Overview',g:'Dashboard'},
 {k:'portal',t:'My account',g:'Dashboard'},
 {k:'donations',t:'Donations in',g:'Food flow',lead:'Who donated the food, and which volunteer collected it from them.'},
 {k:'hampers',t:'Hampers out',g:'Food flow',lead:'Which volunteer gave a hamper, and which recipient received the free food. Volunteers mark upcoming pickups here: Missed or Delayed emails the coordinators right away.'},
 {k:'inventory',t:'Inventory',g:'Food flow',lead:'Food in stock, soonest expiry first. HIGH: 3 days or less left. WATCH: the AI check predicts it may expire before it can all be given out.'},
 {k:'expiry',t:'Expiry section',g:'Food flow',lead:'Expired items removed from inventory. This feeds the Inventory Waste report.'},
 {k:'coordinators',t:'Coordinators',g:'People',lead:'Coordinators manage the system and receive every alert email.'},
 {k:'donors',t:'Donors',g:'People',lead:'People and businesses who give food.'},
 {k:'recipients',t:'Recipients',g:'People',lead:'Households who receive free hampers.'},
 {k:'volunteers',t:'Volunteers',g:'People',lead:'Our team. Volunteers collect donations and hand out hampers.'},
 {k:'shifts',t:'Shifts',g:'People',lead:'Shifts created by the coordinator, with assigned volunteers.'},
 {k:'ai',t:'AI assistant',g:'Automation'},
 {k:'emails',t:'AI alert emails',g:'Automation',lead:'Pickup alerts go to the coordinators. Expiry alerts go to the coordinators and to volunteers on upcoming shifts. Click a row to read the email.'},
 {k:'reports',t:'Reports',g:'Automation'},
 {k:'categories',t:'Categories',g:'Admin',lead:'Inventory categories managed by the coordinator.'},
 {k:'accounts',t:'Logins',g:'Admin',lead:'One login table for every role. Passwords are stored as secure hashes, never as plain text.'}];
const api=async(url,body)=>{const r=await fetch(url,body===undefined?{}:{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
 let j;try{j=await r.json()}catch(e){throw new Error('The server did not answer. Is python app.py still running?')}
 if(!r.ok&&j.error)throw new Error(j.error);return j};
let cur=location.hash.slice(1)||'overview',sk=null,asc=true;
function nav(){let g='',h='';S.forEach(s=>{if(s.g!==g){g=s.g;h+=`<div class="grp">${g}</div>`}
 const n=Array.isArray(D[s.k])?`<small>${D[s.k].length}</small>`:'';h+=`<a class="${s.k==cur?'on':''}" onclick="go('${s.k}')">${s.t}${n}</a>`});document.getElementById('nav').innerHTML=h}
function go(k){cur=k;sk=null;try{history.replaceState(null,'','#'+k)}catch(e){}render()}
function overview(){const s=D.stats;const c=(n,l,w)=>`<div class="card ${w||''}"><span>${l}</span><b>${n}</b></div>`;
 return `<h2>Overview</h2><p class="lead">Snapshot generated ${D.generated}.</p>
 <div class="flow"><div class="n">Donor<small>gives food</small></div><div class="ar">→</div><div class="n">Volunteer<small>collects & logs it</small></div><div class="ar">→</div>
 <div class="n">Inventory<small>AI checks expiry every 6 h</small></div><div class="ar">→</div><div class="n">Recipient<small>gets a free hamper</small></div></div>
 <div class="cards">${c(s.donors,'Donors')}${c(s.donations,'Donations received')}${c(s.instock,'Items in stock')}${c(s.highrisk,'High-risk items (≤3 days)','warn')}${s.pending?c(s.pending,'Expired, waiting for AI removal','warn'):''}
 ${c(s.expired,'Expired & removed','warn')}${c(s.hampers,'Hampers given out')}${c(s.recipients,'Approved recipients')}${c(s.volunteers,'Volunteers')}${c(s.coordinators,'Coordinators')}${c(s.emails,'AI alert emails')}</div>
 <h2 style="font-size:16px;margin-bottom:10px">Stock by category</h2>${table(D.categories,'categories',true)}`}
function aiPage(){const a=D.ai;return `<h2>AI assistant <span class="badge ${a.muse?'':'off'}">${a.muse?'AI: '+a.muse_status:'AI key missing'}</span> <span class="badge ${a.smtp?'':'off'}">${a.smtp?'Email: sending':'Email: log only'}</span></h2>
 <p class="lead">The system flags expiring food and late pickups, and the AI writes the alert emails. While the app is open, pickups are checked every ${a.pickup_minutes} minutes and the full check runs every ${a.every_hours} hours. You can also run it any time.</p>
 <div class="panel"><h3>Demo controls</h3><p class="role">For the presentation: pretend it's a later date, or make an item expire, then run the AI check and watch it get removed.</p>
 <div class="grid2"><div><b style="font-size:13px">Pretend today is</b><div class="row" style="margin-top:6px"><input type="date" id="dd" value="${D.today}"><button class="btn sec" onclick="demo('date',{date:document.getElementById('dd').value})">Set date</button><button class="btn sec" onclick="demo('date',{date:null})">Use real date</button></div></div>
 <div><b style="font-size:13px">Change an item's expiry date</b><div class="row" style="margin-top:6px"><select id="di" class="wide">${D.items.map(i=>`<option value="${i.id}">${esc(i.label)}</option>`).join('')}</select><input type="date" id="de" value="${D.today}"><button class="btn sec" onclick="demo('expiry',{item_id:document.getElementById('di').value,date:document.getElementById('de').value})">Save</button></div></div></div>
 <div class="row" style="margin-top:12px"><button class="btn sec" onclick="if(window.confirmReset){demo('reset',{})}else{window.confirmReset=1;this.textContent='Click again to reset all test data'}">Reset all test data</button><span class="role" id="demoo"></span></div></div>
 <div class="panel"><h3>1. Expiry & pickup check</h3><p class="role">Moves expired food to the expiry section, flags HIGH risk (3 days or less) and WATCH items (may expire before they can be given out), spots declining categories, marks late pickups, and emails the coordinators (plus volunteers on upcoming shifts for expiry alerts).
 Last run: ${a.last_run||'not yet this session'} · Next automatic run: ${a.next_run||'—'}</p>
 <button class="btn" id="runb" onclick="runAI()">Run AI check now</button><div class="out" id="runo">Results will show here.</div></div>
 <div class="panel"><h3>2. Inventory insight report</h3><p class="role">Shelf-life trends, what to use first, and hamper suggestions that respect each recipient's dietary needs.</p>
 <button class="btn sec" id="insb" onclick="ask()">Generate report</button><div class="out" id="inso">The report will show here.</div></div>
 <div class="panel"><h3>3. Ask the AI about the data</h3><p class="role">Ask a question in plain English. The AI answers using only the live database.</p>
 <div class="row"><input id="askq" placeholder="e.g. Which category is wasting the most food?" onkeydown="if(event.key==='Enter')ask(this.value)"><button class="btn sec" onclick="ask(document.getElementById('askq').value)">Ask</button></div>
 <div class="chips">${['What should go in the next hamper for Emily Chen?','Which donor gives the most perishable food?','How many items expire this week?'].map(q=>`<span class="chip" onclick="document.getElementById('askq').value=this.textContent;ask(this.textContent)">${q}</span>`).join('')}</div>
 <div class="out" id="asko">Answers will show here.</div></div>`}
function simpleTable(rows){if(!rows.length)return '<div class="tbl" style="padding:18px;color:#667085">Nothing in this period.</div>';const cols=Object.keys(rows[0]);
 return `<div class="tbl" style="max-height:none"><table><tr>${cols.map(c=>`<th style="cursor:default">${esc(c)}</th>`).join('')}</tr>${rows.map(r=>`<tr>${cols.map((c,j)=>`<td>${c==='Type'?pill(r[c]):j==0?`<b>${esc(r[c])}</b>`:esc(r[c])}</td>`).join('')}</tr>`).join('')}</table></div>`}
function reportsPage(){const [y,mo]=D.today.split('-').map(Number);const M=['January','February','March','April','May','June','July','August','September','October','November','December'];
 return `<h2>Reports</h2><p class="lead">Two report types, for any month or a whole year. Built from the live tables.</p>
 <div class="tools"><select id="rt"><option value="donation">Donation & Distribution Summary</option><option value="waste">Inventory Waste Summary</option></select>
 <select id="rm"><option value="">Whole year</option>${M.map((n,i)=>`<option value="${i+1}" ${i+1==mo?'selected':''}>${n}</option>`).join('')}</select>
 <input id="ry" type="number" min="2000" max="2100" value="${y}" style="width:100px"><button class="btn" onclick="runReport()">Generate report</button></div><div id="rep"></div>`}
async function runReport(){const o=document.getElementById('rep');o.innerHTML='<p class="lead">Building the report...</p>';
 if(window.__EMBED__){o.innerHTML='<p class="lead">Run the app locally (python app.py) to generate reports.</p>';return}
 try{const j=await api(`/api/report?type=${document.getElementById('rt').value}&year=${document.getElementById('ry').value}&month=${document.getElementById('rm').value}`);
 o.innerHTML=`<h2 style="font-size:17px;margin:6px 0 12px">${esc(j.title)}</h2><div class="cards">${j.summary.map(x=>`<div class="card"><span>${esc(x[0])}</span><b>${esc(x[1])}</b></div>`).join('')}</div>`+
 j.tables.map(t=>`<h2 style="font-size:15px;margin:18px 0 8px">${esc(t[0])}</h2>${simpleTable(t[1])}`).join('')}catch(e){o.innerHTML=`<p class="lead">${esc(e.message)}</p>`}}
function loginBox(){return `<div class="panel"><h3>Test a login</h3><p class="role">Every test account uses the password <b>${esc(D.test_password)}</b>. Click a row's email below, or type one.</p>
 <div class="row"><input id="le" placeholder="email" autocomplete="off"><input id="lp" type="password" placeholder="password" style="width:180px" onkeydown="if(event.key==='Enter')tryLogin()"><button class="btn sec" onclick="tryLogin()">Check login</button><span class="role" id="lo"></span></div></div>`}
async function tryLogin(){const o=document.getElementById('lo');o.textContent='Checking...';
 try{const r=await fetch('/api/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:document.getElementById('le').value,password:document.getElementById('lp').value})});
 const j=await r.json();o.textContent=j.msg||j.error;if(j.ok){D=await api('/api/data');nav();draw()}}catch(e){o.textContent='Could not reach the server.'}}
async function markPickup(id,status,btn){const cell=btn.parentElement;cell.innerHTML='<span class="role">Saving...</span>';
 if(window.__EMBED__){cell.innerHTML='<span class="role">Run the app locally to change pickups.</span>';return}
 try{const j=await api(`/api/distribution/${id}/status`,{status});D=await api('/api/data');const y=window.scrollY;draw();window.scrollTo(0,y);toast(j.msg)}
 catch(e){cell.innerHTML=`<span class="role">${esc(e.message)}</span>`}}
function toast(t){let el=document.getElementById('toast');if(!el){el=document.createElement('div');el.id='toast';el.style.cssText='position:fixed;bottom:20px;right:20px;background:#12352a;color:#fff;padding:12px 16px;border-radius:10px;font-size:13px;max-width:420px;box-shadow:0 6px 20px rgba(0,0,0,.2);z-index:9';document.body.appendChild(el)}
 el.textContent=t;el.style.display='block';clearTimeout(el._t);el._t=setTimeout(()=>el.style.display='none',6000)}
let ME=null;
function portalPage(){return `<h2>My account</h2><p class="lead">What a donor or recipient sees after logging in: only their own history, searchable by date (and by category for donors). Every test account uses the password <b>${esc(D.test_password)}</b>.</p><div id="pt"></div>`}
function portalLogin(msg){const ex=D.recipients.find(r=>r.Status==='Approved');const dn=D.donors[0];
 document.getElementById('pt').innerHTML=`<div class="panel"><h3>Log in</h3><p class="role">Try a recipient (${esc(ex?ex.Email:'')}) or a donor (${esc(dn?dn.Email:'')}).</p>
 <div class="row"><input id="pe" placeholder="email" autocomplete="off" value="${esc(ex?ex.Email:'')}"><input id="pp" type="password" placeholder="password" style="width:180px" onkeydown="if(event.key==='Enter')portalSignIn()">
 <button class="btn" onclick="portalSignIn()">Log in</button><span class="role" id="po">${esc(msg||'')}</span></div></div>`}
async function portalSignIn(){const o=document.getElementById('po');o.textContent='Checking...';
 if(window.__EMBED__){o.textContent='Run the app locally to log in.';return}
 const r=await fetch('/api/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:document.getElementById('pe').value,password:document.getElementById('pp').value})});
 const j=await r.json();if(!j.ok){o.textContent=j.msg||j.error;return}loadPortal()}
async function portalLogout(){await fetch('/api/logout',{method:'POST'});ME=null;portalLogin('Logged out.')}
async function loadPortal(){if(window.__EMBED__){portalLogin('Run the app locally to log in.');return}
 const qs=new URLSearchParams();['from','to','category'].forEach(k=>{const el=document.getElementById('p_'+k);if(el&&el.value)qs.set(k,el.value)});
 const r=await fetch('/api/my/history?'+qs);const j=await r.json();
 if(r.status===401){portalLogin();return}if(!j.ok){portalLogin(j.error);return}
 const keep={from:(document.getElementById('p_from')||{}).value||'',to:(document.getElementById('p_to')||{}).value||'',category:(document.getElementById('p_category')||{}).value||''};
 const isR=j.role==='Recipient';const cats=D.categories.map(c=>c.Category);
 document.getElementById('pt').innerHTML=`<div class="panel"><div class="row" style="justify-content:space-between"><h3 style="margin:0">${esc(j.profile.Name)} ${pill(j.role)}</h3><button class="btn sec" onclick="portalLogout()">Log out</button></div>
 <div class="cards" style="margin:12px 0 0">${Object.entries(j.profile).filter(([k])=>k!=='Name').map(([k,v])=>`<div class="card"><span>${esc(k)}</span><div style="margin-top:4px;font-weight:600">${esc(v??'')}</div></div>`).join('')}</div></div>
 <div class="tools"><b style="font-size:14px">${isR?'My hampers':'My donations'}</b><label class="role">From <input type="date" id="p_from" style="width:auto" value="${keep.from}" onchange="loadPortal()"></label>
 <label class="role">To <input type="date" id="p_to" style="width:auto" value="${keep.to}" onchange="loadPortal()"></label>
 ${isR?'':`<select id="p_category" onchange="loadPortal()"><option value="">All categories</option>${cats.map(c=>`<option ${c===keep.category?'selected':''}>${esc(c)}</option>`).join('')}</select>`}
 <button class="btn sec" onclick="['p_from','p_to','p_category'].forEach(i=>{const e=document.getElementById(i);if(e)e.value=''});loadPortal()">Clear</button><span class="cnt">${j.rows.length} ${isR?'hampers':'donations'}</span></div>
 ${j.rows.length?`<div class="tbl" style="max-height:none"><table><tr><th>Date</th><th>${isR?'Status':'Collected by'}</th><th>${isR?'Given by':''}</th><th>Items</th></tr>${j.rows.map(x=>`<tr><td style="white-space:nowrap"><b>${esc(x.date)}</b><div class="role">#${x.id}</div></td>
 <td>${isR?pill(x.status):esc(x.collected_by||'')}</td><td>${isR?esc(x.given_by||''):''}</td><td>${fmtItems(x.items,'p'+x.id)}</td></tr>`).join('')}</table></div>`:'<div class="tbl" style="padding:24px;color:#667085">Nothing in this date range.</div>'}`}
async function demo(kind,body){const o=document.getElementById('demoo');o.textContent='Working...';
 try{const j=await api('/api/demo/'+kind,body);D=await api('/api/data');window.confirmReset=0;render();document.getElementById('demoo').textContent=j.msg}
 catch(e){o.textContent=e.message}}
async function runAI(){if(window.__EMBED__){document.getElementById('runo').textContent='This is the online preview. Run the app locally (python app.py) to use the AI.';return}const b=document.getElementById('runb'),o=document.getElementById('runo');b.disabled=true;o.textContent='Running the AI check...';
 try{const j=await api('/api/ai/run',{});const msg=j.log.join('\n');D=await api('/api/data');render();document.getElementById('runo').textContent=msg}
 catch(e){o.textContent='Could not run the check: '+e.message;b.disabled=false}}
async function ask(q){if(window.__EMBED__){const isQ0=typeof q==='string';document.getElementById(isQ0?'asko':'inso').textContent='This is the online preview. Run the app locally (python app.py) to use the AI.';return}const isQ=typeof q==='string';if(isQ&&!q.trim())return;const o=document.getElementById(isQ?'asko':'inso');const b=document.getElementById('insb');
 o.textContent='The AI is reading the database...';if(!isQ)b.disabled=true;
 try{const j=await api('/api/ai/insights',isQ?{question:q}:{});o.textContent=j.text;if(j.ok&&!D.ai.muse_status.startsWith('connected')){D=await api('/api/data');const bd=document.querySelector('h2 .badge');if(bd)bd.textContent='AI: '+D.ai.muse_status}}
 catch(e){o.textContent=e.message}if(!isQ)b.disabled=false}
function rowsFor(k){const q=(document.getElementById('q')||{}).value?.toLowerCase()||'';const f=(document.getElementById('f')||{}).value||'';
 const df=(document.getElementById('df')||{}).value||'',dt=(document.getElementById('dt')||{}).value||'';
 let r=D[k].filter(x=>(!q||Object.values(x).join(' ').toLowerCase().includes(q))&&(!f||Object.values(x).includes(f)||Object.values(x).map(String).includes(f))&&(!df||!x.day||x.day>=df)&&(!dt||!x.day||x.day<=dt));
 if(sk){r=[...r].sort((a,b)=>{let x=a[sk],y=b[sk];if(typeof x==='number'&&typeof y==='number')return(x-y)*(asc?1:-1);return String(x??'').localeCompare(String(y??''),undefined,{numeric:true})*(asc?1:-1)})}return r}
function table(rows,k,plain){
 if(k==='donations'){return `<div class="tbl"><table><tr><th>Date</th><th>Donor (gives)</th><th></th><th>Collected by (volunteer)</th><th>Items donated</th></tr>${rows.map(r=>`<tr><td style="white-space:nowrap">${esc(r.date)}<div class="role">Donation #${r.id}</div></td>
  <td><div class="who">${esc(r.donor)}</div>${pill(r.type)}</td><td class="arrow">→</td><td><div class="who">${esc(r.collected||'—')}</div><div class="role">Volunteer</div></td><td>${fmtItems(r.items,'d'+r.id)}<div class="role">${r.n} item lines</div></td></tr>`).join('')}</table></div>`}
 if(k==='hampers'){return `<div class="tbl"><table><tr><th>Pickup</th><th>Given by (volunteer)</th><th></th><th>Received by (recipient)</th><th>Hamper contents</th><th>Status</th></tr>${rows.map(r=>`<tr><td style="white-space:nowrap">${esc(r.date)}<div class="role">Hamper #${r.id}</div></td>
  <td><div class="who">${esc(r.given||'—')}</div><div class="role">Volunteer</div></td><td class="arrow">→</td><td><div class="who">${esc(r.recipient)}</div><div class="role">Household of ${r.hh} · ${esc(r.prefs)}</div></td><td>${fmtItems(r.items,'h'+r.id)}</td><td>${pill(r.status)}${(r.status==='Scheduled'||r.status==='Delayed')?`<div>${['Fulfilled','Missed','Delayed'].filter(x=>x!==r.status).map(x=>`<button class="mini" onclick="markPickup(${r.id},'${x}',this)">${x}</button>`).join('')}</div>`:''}</td></tr>`).join('')}</table></div>`}
 const cols=Object.keys(rows[0]||{}).filter(c=>c!=='body');
 return `<div class="tbl"><table><tr>${cols.map(c=>`<th ${plain?'':`onclick="srt('${c}')"`}>${esc(c)}${sk==c?(asc?' ▲':' ▼'):''}</th>`).join('')}</tr>${rows.map((r,i)=>`<tr ${k==='emails'?`style="cursor:pointer" onclick="const m=document.getElementById('mb${i}');m.style.display=m.style.display=='block'?'none':'block'"`:''}>${cols.map((c,j)=>{let v=r[c];
  if(PILLS.includes(c))return `<td>${pill(v)}</td>`;
  if(c==='DaysLeft')return `<td class="${v<=3?'neg':v<=7?'soon':''}">${v<0?'Expired '+(-v)+' day'+(v==-1?'':'s')+' ago':v+' day'+(v==1?'':'s')}</td>`;
  if(k==='emails'&&c==='Subject')return `<td>${esc(v)}<div class="mail" id="mb${i}">${esc(r.body)}</div></td>`;
  if(k==='accounts'&&c==='Email')return `<td><a href="#accounts" onclick="document.getElementById('le').value=this.textContent;document.getElementById('lp').focus();return false">${esc(v)}</a></td>`;
  return `<td>${j==1&&k!=='emails'?`<b>${esc(v)}</b>`:esc(v)}</td>`}).join('')}</tr>`).join('')}</table></div>`}
function filterFor(k){const dates=(k==='donations'||k==='hampers')?`<label class="role">From <input type="date" id="df" style="width:auto" onchange="draw()"></label><label class="role">To <input type="date" id="dt" style="width:auto" onchange="draw()"></label>`:'';
 const m={accounts:'Role',inventory:'Risk',expiry:'Category',hampers:'status',shifts:'When',emails:'Written By',donors:'Type'}[k];if(!m)return dates;
 const vals=[...new Set(D[k].map(r=>r[m]).filter(Boolean))].sort();return dates+`<select id="f" onchange="draw()"><option value="">All ${m.toLowerCase()==='status'?'statuses':m.toLowerCase()+'s'}</option>${vals.map(v=>`<option>${esc(v)}</option>`).join('')}</select>`}
function render(){nav();const s=S.find(x=>x.k==cur)||S[0];const m=document.getElementById('m');
 const banner=D.demo_date?`<div class="demo">Demo mode: the system thinks today is <b>${D.demo_date}</b>. Days left, expiry and alerts use this date. <a href="#ai" onclick="go('ai')">Change it</a></div>`:'';
 if(s.k==='overview'){m.innerHTML=banner+overview();return}
 if(s.k==='ai'){m.innerHTML=banner+aiPage();return}
 if(s.k==='portal'){m.innerHTML=banner+portalPage();loadPortal();return}
 if(s.k==='reports'){m.innerHTML=banner+reportsPage();runReport();return}
 m.innerHTML=banner+`<h2>${s.t}</h2><p class="lead">${s.lead}</p>${s.k==='accounts'?loginBox():''}<div class="tools"><input id="q" placeholder="Search ${s.t.toLowerCase()}..." oninput="draw()">${filterFor(s.k)}<span class="cnt" id="cnt"></span></div><div id="tb"></div>`;draw()}
function draw(){const r=rowsFor(cur);document.getElementById('tb').innerHTML=r.length?table(r,cur):'<div class="tbl" style="padding:30px;text-align:center;color:#667085">No records found.</div>';document.getElementById('cnt').textContent=r.length+' rows'}
function srt(c){asc=sk==c?!asc:true;sk=c;draw()}
async function load(){if(window.__EMBED__){D=window.__EMBED__;render();return}try{D=await api('/api/data');render()}
 catch(e){document.getElementById('m').innerHTML=`<h2>Cannot load the data</h2><p class="lead">${esc(e.message)}</p><button class="btn" onclick="load()">Try again</button>`}}
window.addEventListener('hashchange',()=>{const k=location.hash.slice(1);if(k&&k!==cur){cur=k;render()}});load();
</script></body></html>
